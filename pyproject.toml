[project]
name = "n2n"
version = "0.1.0"
description = "N2N — a fail-closed disclosure gate. Certifies a document for release under a declared purpose, with signed evidence, or refuses and says why."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.11.0",
    "typer>=0.9.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "reportlab>=4.0.0"]

[project.scripts]
n2n = "n2n.cli:app"

[tool.setuptools]
packages = ["n2n", "n2n.detectors", "n2n.packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"
