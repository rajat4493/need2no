[project]
name = "n2n"
version = "0.1.0"
description = "N2N — a fail-closed disclosure gate. Certifies a document for release under a declared purpose, with signed evidence, or refuses and says why."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.11.0",
    "typer>=0.9.0",
    "cryptography>=41.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pikepdf>=8.0.0",
    "fonttools>=4.50.0",
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "reportlab>=4.0.0", "httpx>=0.27.0", "pytest-asyncio>=0.24.0", "x-ray>=0.3.0"]

[project.scripts]
n2n = "n2n.cli:app"

[tool.setuptools]
packages = ["n2n", "n2n.detectors", "n2n.packs", "n2n.webapp"]

[tool.setuptools.package-data]
"n2n.webapp" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"
